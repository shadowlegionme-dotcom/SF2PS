
name: SF2PS Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            libsqlite3-dev zlib1g-dev unzip

      - name: Extract source
        run: |
          mkdir source
          unzip -q SF2PS-main.zip -d source

      - name: Configure
        run: |
          cmake -S source/SF2PS-main \
            -B build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: SF2PS-Linux-Server
          path: build/sf2server

